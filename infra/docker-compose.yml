services:
  mysql:
    image: mysql:8.4
    container_name: smart-event-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: smart_event
      MYSQL_USER: smart_event
      MYSQL_PASSWORD: smart_event_dev
    ports:
      - "3306:3306"
    volumes:
      - smart_event_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smart_event_mysql_data:
