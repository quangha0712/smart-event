services:
  mysql:
    image: mysql:8.4
    container_name: smart-event-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "557799"
      MYSQL_DATABASE: smart_event
    ports:
      - "3307:3306"
    volumes:
      - smart_event_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p557799"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  smart_event_mysql_data:
